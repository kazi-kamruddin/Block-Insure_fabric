name: block-insure-dev-lite
networks:
  default:
    name: block-insure-dev-lite
volumes:
  orderer:
  peer-insurer:
  peer-hospital:
  peer-auditor:
  peer-bank:
  peer-oracle:

x-ca: &ca
  image: hyperledger/fabric-ca:1.5.17
  command: fabric-ca-server start -b admin:adminpw

x-ca-env: &ca-env
  FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
  FABRIC_CA_SERVER_DEBUG: "false"
  FABRIC_CA_SERVER_TLS_ENABLED: "true"

x-peer-env: &peer-env
  FABRIC_CFG_PATH: /etc/hyperledger/peercfg
  FABRIC_LOGGING_SPEC: INFO
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_PROFILE_ENABLED: "false"
  CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
  CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
  CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
  CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
  CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
  CORE_METRICS_PROVIDER: prometheus
  CORE_CHAINCODE_EXECUTETIMEOUT: 300s
  # Select a builder matching the future 1.9.0 package before deployment.
  CORE_CHAINCODE_BUILDER: ${DEV_LITE_CHAINCODE_BUILDER:-hyperledger/fabric-ccenv:2.5.16}
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: block-insure-dev-lite
  CORE_PEER_NETWORKID: devlite
  CORE_LEDGER_STATE_STATEDATABASE: goleveldb

x-peer: &peer
  image: hyperledger/fabric-peer:2.5.16
  command: peer node start

services:
  orderer:
    image: hyperledger/fabric-orderer:2.5.16
    labels:
      service: hyperledger-fabric
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
      ORDERER_METRICS_PROVIDER: prometheus
    volumes:
      - ../../data/dev-lite/organizations/ordererOrganizations/blockinsure.test/orderers/orderer.blockinsure.test/msp:/var/hyperledger/orderer/msp
      - ../../data/dev-lite/organizations/ordererOrganizations/blockinsure.test/orderers/orderer.blockinsure.test/tls:/var/hyperledger/orderer/tls
      - orderer:/var/hyperledger/production/orderer
    ports: ["127.0.0.1:31050:7050", "127.0.0.1:31053:7053"]
    command: orderer
    networks:
      default:
        aliases: [orderer.blockinsure.test]

  ca-insurer:
    <<: *ca
    environment:
      <<: *ca-env
      FABRIC_CA_SERVER_CA_NAME: ca-insurer
      FABRIC_CA_SERVER_PORT: 31054
    ports: ["127.0.0.1:31054:31054"]
    volumes: ["../../data/dev-lite/organizations/fabric-ca/insurer:/etc/hyperledger/fabric-ca-server"]

  ca-hospital:
    <<: *ca
    environment:
      <<: *ca-env
      FABRIC_CA_SERVER_CA_NAME: ca-hospital
      FABRIC_CA_SERVER_PORT: 31154
    ports: ["127.0.0.1:31154:31154"]
    volumes: ["../../data/dev-lite/organizations/fabric-ca/hospital:/etc/hyperledger/fabric-ca-server"]

  ca-auditor:
    <<: *ca
    environment:
      <<: *ca-env
      FABRIC_CA_SERVER_CA_NAME: ca-auditor
      FABRIC_CA_SERVER_PORT: 31254
    ports: ["127.0.0.1:31254:31254"]
    volumes: ["../../data/dev-lite/organizations/fabric-ca/auditor:/etc/hyperledger/fabric-ca-server"]

  ca-bank:
    <<: *ca
    environment:
      <<: *ca-env
      FABRIC_CA_SERVER_CA_NAME: ca-bank
      FABRIC_CA_SERVER_PORT: 31354
    ports: ["127.0.0.1:31354:31354"]
    volumes: ["../../data/dev-lite/organizations/fabric-ca/bank:/etc/hyperledger/fabric-ca-server"]

  ca-oracle:
    <<: *ca
    environment:
      <<: *ca-env
      FABRIC_CA_SERVER_CA_NAME: ca-oracle
      FABRIC_CA_SERVER_PORT: 31454
    ports: ["127.0.0.1:31454:31454"]
    volumes: ["../../data/dev-lite/organizations/fabric-ca/oracle:/etc/hyperledger/fabric-ca-server"]

  ca-orderer:
    <<: *ca
    environment:
      <<: *ca-env
      FABRIC_CA_SERVER_CA_NAME: ca-orderer
      FABRIC_CA_SERVER_PORT: 31554
    ports: ["127.0.0.1:31554:31554"]
    volumes: ["../../data/dev-lite/organizations/fabric-ca/orderer:/etc/hyperledger/fabric-ca-server"]

  peer-insurer:
    <<: *peer
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.insurer.dev-lite.blockinsure.test
      CORE_PEER_ADDRESS: peer0.insurer.blockinsure.test:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.insurer.blockinsure.test:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.insurer.blockinsure.test:7051
      CORE_PEER_LOCALMSPID: InsurerMSP
    ports: ["127.0.0.1:31051:7051"]
    networks:
      default:
        aliases: [peer0.insurer.blockinsure.test]
    volumes:
      - ../../data/dev-lite/organizations/peerOrganizations/insurer.blockinsure.test/peers/peer0.insurer.blockinsure.test:/etc/hyperledger/fabric:ro
      - ../.fabric/fabric-samples/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer-insurer:/var/hyperledger/production

  peer-hospital:
    <<: *peer
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.hospital.dev-lite.blockinsure.test
      CORE_PEER_ADDRESS: peer0.hospital.blockinsure.test:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.hospital.blockinsure.test:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.hospital.blockinsure.test:7051
      CORE_PEER_LOCALMSPID: HospitalMSP
    ports: ["127.0.0.1:31151:7051"]
    networks:
      default:
        aliases: [peer0.hospital.blockinsure.test]
    volumes:
      - ../../data/dev-lite/organizations/peerOrganizations/hospital.blockinsure.test/peers/peer0.hospital.blockinsure.test:/etc/hyperledger/fabric:ro
      - ../.fabric/fabric-samples/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer-hospital:/var/hyperledger/production

  peer-auditor:
    <<: *peer
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.auditor.dev-lite.blockinsure.test
      CORE_PEER_ADDRESS: peer0.auditor.blockinsure.test:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.auditor.blockinsure.test:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.auditor.blockinsure.test:7051
      CORE_PEER_LOCALMSPID: AuditorMSP
    ports: ["127.0.0.1:31251:7051"]
    networks:
      default:
        aliases: [peer0.auditor.blockinsure.test]
    volumes:
      - ../../data/dev-lite/organizations/peerOrganizations/auditor.blockinsure.test/peers/peer0.auditor.blockinsure.test:/etc/hyperledger/fabric:ro
      - ../.fabric/fabric-samples/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer-auditor:/var/hyperledger/production

  peer-bank:
    <<: *peer
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.bank.dev-lite.blockinsure.test
      CORE_PEER_ADDRESS: peer0.bank.blockinsure.test:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.bank.blockinsure.test:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.bank.blockinsure.test:7051
      CORE_PEER_LOCALMSPID: BankMSP
    ports: ["127.0.0.1:31351:7051"]
    networks:
      default:
        aliases: [peer0.bank.blockinsure.test]
    volumes:
      - ../../data/dev-lite/organizations/peerOrganizations/bank.blockinsure.test/peers/peer0.bank.blockinsure.test:/etc/hyperledger/fabric:ro
      - ../.fabric/fabric-samples/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer-bank:/var/hyperledger/production

  peer-oracle:
    <<: *peer
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.oracle.dev-lite.blockinsure.test
      CORE_PEER_ADDRESS: peer0.oracle.blockinsure.test:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.oracle.blockinsure.test:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.oracle.blockinsure.test:7051
      CORE_PEER_LOCALMSPID: OracleMSP
    ports: ["127.0.0.1:31451:7051"]
    networks:
      default:
        aliases: [peer0.oracle.blockinsure.test]
    volumes:
      - ../../data/dev-lite/organizations/peerOrganizations/oracle.blockinsure.test/peers/peer0.oracle.blockinsure.test:/etc/hyperledger/fabric:ro
      - ../.fabric/fabric-samples/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer-oracle:/var/hyperledger/production
