name: block-insure

networks:
  block-insure:
    name: block-insure

volumes:
  orderer.blockinsure.test:
  peer0.insurer.blockinsure.test:
  peer0.hospital.blockinsure.test:
  peer0.auditor.blockinsure.test:
  peer0.bank.blockinsure.test:
  peer0.oracle.blockinsure.test:

x-peer-environment: &peer-environment
  FABRIC_CFG_PATH: /etc/hyperledger/peercfg
  FABRIC_LOGGING_SPEC: INFO
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_PROFILE_ENABLED: "false"
  CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
  CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
  CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
  CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
  CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
  CORE_METRICS_PROVIDER: prometheus
  CORE_CHAINCODE_EXECUTETIMEOUT: 300s
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: block-insure
  CORE_LEDGER_STATE_STATEDATABASE: CouchDB
  CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: admin
  CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: adminpw

x-peer-defaults: &peer-defaults
  image: hyperledger/fabric-peer:2.5.16
  labels:
    service: hyperledger-fabric
  environment: *peer-environment
  working_dir: /root
  command: peer node start
  networks: [block-insure]

x-couchdb-defaults: &couchdb-defaults
  image: couchdb:3.3.3
  labels:
    service: hyperledger-fabric
  environment:
    COUCHDB_USER: admin
    COUCHDB_PASSWORD: adminpw
  networks: [block-insure]

services:
  orderer:
    image: hyperledger/fabric-orderer:2.5.16
    container_name: orderer.blockinsure.test
    labels:
      service: hyperledger-fabric
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
      ORDERER_METRICS_PROVIDER: prometheus
    volumes:
      - ../organizations/ordererOrganizations/blockinsure.test/orderers/orderer.blockinsure.test/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/blockinsure.test/orderers/orderer.blockinsure.test/tls:/var/hyperledger/orderer/tls
      - orderer.blockinsure.test:/var/hyperledger/production/orderer
    ports: ["7050:7050", "7053:7053", "9443:9443"]
    command: orderer
    networks: [block-insure]

  couchdb-insurer:
    <<: *couchdb-defaults
    container_name: couchdb.insurer.blockinsure.test
    ports: ["5984:5984"]
  couchdb-hospital:
    <<: *couchdb-defaults
    container_name: couchdb.hospital.blockinsure.test
    ports: ["6984:5984"]
  couchdb-auditor:
    <<: *couchdb-defaults
    container_name: couchdb.auditor.blockinsure.test
    ports: ["7984:5984"]
  couchdb-bank:
    <<: *couchdb-defaults
    container_name: couchdb.bank.blockinsure.test
    ports: ["8984:5984"]
  couchdb-oracle:
    <<: *couchdb-defaults
    container_name: couchdb.oracle.blockinsure.test
    ports: ["9984:5984"]

  peer-insurer:
    <<: *peer-defaults
    container_name: peer0.insurer.blockinsure.test
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.insurer.blockinsure.test
      CORE_PEER_ADDRESS: peer0.insurer.blockinsure.test:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.insurer.blockinsure.test:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.insurer.blockinsure.test:7051
      CORE_PEER_LOCALMSPID: InsurerMSP
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb-insurer:5984
    volumes:
      - ../organizations/peerOrganizations/insurer.blockinsure.test/peers/peer0.insurer.blockinsure.test:/etc/hyperledger/fabric
      - ../.fabric/fabric-samples/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /var/run:/host/var/run
      - peer0.insurer.blockinsure.test:/var/hyperledger/production
    ports: ["7051:7051", "9444:9444"]
    depends_on: [couchdb-insurer]

  peer-hospital:
    <<: *peer-defaults
    container_name: peer0.hospital.blockinsure.test
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.hospital.blockinsure.test
      CORE_PEER_ADDRESS: peer0.hospital.blockinsure.test:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.hospital.blockinsure.test:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.hospital.blockinsure.test:7051
      CORE_PEER_LOCALMSPID: HospitalMSP
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb-hospital:5984
    volumes:
      - ../organizations/peerOrganizations/hospital.blockinsure.test/peers/peer0.hospital.blockinsure.test:/etc/hyperledger/fabric
      - ../.fabric/fabric-samples/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /var/run:/host/var/run
      - peer0.hospital.blockinsure.test:/var/hyperledger/production
    ports: ["8051:7051", "9445:9444"]
    depends_on: [couchdb-hospital]

  peer-auditor:
    <<: *peer-defaults
    container_name: peer0.auditor.blockinsure.test
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.auditor.blockinsure.test
      CORE_PEER_ADDRESS: peer0.auditor.blockinsure.test:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.auditor.blockinsure.test:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.auditor.blockinsure.test:7051
      CORE_PEER_LOCALMSPID: AuditorMSP
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb-auditor:5984
    volumes:
      - ../organizations/peerOrganizations/auditor.blockinsure.test/peers/peer0.auditor.blockinsure.test:/etc/hyperledger/fabric
      - ../.fabric/fabric-samples/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /var/run:/host/var/run
      - peer0.auditor.blockinsure.test:/var/hyperledger/production
    ports: ["9051:7051", "9446:9444"]
    depends_on: [couchdb-auditor]

  peer-bank:
    <<: *peer-defaults
    container_name: peer0.bank.blockinsure.test
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.bank.blockinsure.test
      CORE_PEER_ADDRESS: peer0.bank.blockinsure.test:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.bank.blockinsure.test:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.bank.blockinsure.test:7051
      CORE_PEER_LOCALMSPID: BankMSP
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb-bank:5984
    volumes:
      - ../organizations/peerOrganizations/bank.blockinsure.test/peers/peer0.bank.blockinsure.test:/etc/hyperledger/fabric
      - ../.fabric/fabric-samples/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /var/run:/host/var/run
      - peer0.bank.blockinsure.test:/var/hyperledger/production
    ports: ["12051:7051", "9447:9444"]
    depends_on: [couchdb-bank]

  peer-oracle:
    <<: *peer-defaults
    container_name: peer0.oracle.blockinsure.test
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.oracle.blockinsure.test
      CORE_PEER_ADDRESS: peer0.oracle.blockinsure.test:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.oracle.blockinsure.test:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.oracle.blockinsure.test:7051
      CORE_PEER_LOCALMSPID: OracleMSP
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb-oracle:5984
    volumes:
      - ../organizations/peerOrganizations/oracle.blockinsure.test/peers/peer0.oracle.blockinsure.test:/etc/hyperledger/fabric
      - ../.fabric/fabric-samples/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - /var/run:/host/var/run
      - peer0.oracle.blockinsure.test:/var/hyperledger/production
    ports: ["13051:7051", "9448:9444"]
    depends_on: [couchdb-oracle]
